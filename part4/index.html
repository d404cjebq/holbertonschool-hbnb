<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="images/logo.png" alt="HBnB Logo" class="logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>
    <main>
        <h1>List of Places</h1>
        <section id="filter">
            <h2>Filter</h2>
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <!-- Options will be populated dynamically -->
                <option value="all">All</option>
                <option value="10">$10</option>
                <option value="50">$50</option>
                <option value="100">$100</option>
            </select>
        </section>
        <section id="places-list">
            <h2>Places</h2>
            <!-- List of places will be populated dynamically -->
            <article class="place-card" data-price="120">
                <h3>Cozy Downtown Loft</h3>
                <p class="place-price">$120 / night</p>
                <button class="details-button" onclick="window.location.href='place.html?id=1'">View Details</button>
            </article>

            <article class="place-card" data-price="95">
                <h3>Parisian Studio</h3>
                <p class="place-price">$95 / night</p>
                <button class="details-button" onclick="window.location.href='place.html?id=2'">View Details</button>
            </article>

            <article class="place-card" data-price="150">
                <h3>Kyoto Traditional House</h3>
                <p class="place-price">$150 / night</p>
                <button class="details-button" onclick="window.location.href='place.html?id=3'">View Details</button>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
